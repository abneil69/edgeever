name: Fork Client Builds (DMG & APK)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_macos_arm64:
        description: "Build macOS Apple Silicon (arm64) DMG"
        required: false
        default: true
        type: boolean
      build_macos_x64:
        description: "Build macOS Intel (x64) DMG"
        required: false
        default: false
        type: boolean
      build_android_apk:
        description: "Build Android arm64-v8a APK"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: fork-clients-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-dmg:
    if: >-
      github.repository == 'abneil69/edgeever' &&
      (
        github.event_name == 'push' ||
        inputs.build_macos_arm64 ||
        inputs.build_macos_x64
      )
    name: macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - name: Skip unselected architecture
        id: guard
        run: |
          should_run="false"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${ARCH}" == "arm64" ]]; then
            should_run="true"
          elif [[ "${ARCH}" == "arm64" && "${BUILD_ARM64}" == "true" ]]; then
            should_run="true"
          elif [[ "${ARCH}" == "x64" && "${BUILD_X64}" == "true" ]]; then
            should_run="true"
          fi
          echo "run=${should_run}" >> "${GITHUB_OUTPUT}"
        env:
          ARCH: ${{ matrix.arch }}
          BUILD_ARM64: ${{ inputs.build_macos_arm64 }}
          BUILD_X64: ${{ inputs.build_macos_x64 }}

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v5

      - name: Set up Bun
        if: steps.guard.outputs.run == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        if: steps.guard.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust sidecar build
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/desktop-sidecar/target
          key: fork-macos-${{ matrix.arch }}-rust-${{ hashFiles('crates/desktop-sidecar/Cargo.lock', 'crates/desktop-sidecar/**/*.rs') }}
          restore-keys: |
            fork-macos-${{ matrix.arch }}-rust-

      - name: Cache Electron downloads
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: fork-macos-${{ matrix.arch }}-electron-${{ hashFiles('bun.lock', 'apps/desktop/package.json') }}

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Build Web renderer
        if: steps.guard.outputs.run == 'true'
        env:
          EDGE_EVER_DESKTOP_BUILD: "1"
        run: bun run build:web

      - name: Build Rust sidecar
        if: steps.guard.outputs.run == 'true'
        run: cargo build --manifest-path crates/desktop-sidecar/Cargo.toml --release

      - name: Build macOS Share Extension (ad-hoc signed)
        if: steps.guard.outputs.run == 'true'
        env:
          EDGE_EVER_DESKTOP_ARCH: ${{ matrix.arch }}
        run: bash scripts/build-macos-share-extension.sh

      - name: Package unsigned macOS DMG
        if: steps.guard.outputs.run == 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          release_tag=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          fi
          bun run --cwd apps/desktop dist -- \
            --mac dmg \
            --${{ matrix.arch }} \
            --publish never \
            -c.mac.identity=null \
            -c.mac.notarize=false \
            -c.extraMetadata.edgeeverForkRepo="${GITHUB_REPOSITORY}" \
            -c.extraMetadata.edgeeverForkReleaseTag="${release_tag}"

      - name: Upload DMG artifact
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: edgeever-mac-${{ matrix.arch }}-dmg
          path: release/desktop/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Attach DMG to GitHub Release (on tag push)
        if: steps.guard.outputs.run == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${TAG_NAME}" --generate-notes
          fi
          gh release upload "${TAG_NAME}" release/desktop/*.dmg --repo "${GITHUB_REPOSITORY}" --clobber

  android-apk:
    if: >-
      github.repository == 'abneil69/edgeever' &&
      (
        github.event_name == 'push' ||
        inputs.build_android_apk
      )
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: fork-android-gradle-${{ hashFiles('bun.lock', 'apps/mobile/app.json', 'apps/mobile/package.json') }}
          restore-keys: |
            fork-android-gradle-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare mobile icons
        run: bun run prepare:mobile:icons

      - name: Prebuild Android project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --non-interactive

      - name: Build Android arm64-v8a release APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ks_path="${RUNNER_TEMP}/fork-release.p12"
          if [[ -n "${ANDROID_KEYSTORE_BASE64}" ]]; then
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | openssl base64 -d -A > "${ks_path}"
            chmod 600 "${ks_path}"
            store_pass="${ANDROID_KEYSTORE_PASSWORD}"
            key_alias="${ANDROID_KEY_ALIAS}"
            key_pass="${ANDROID_KEY_PASSWORD}"
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 not set; generating ephemeral PKCS12 keystore for this build."
            keytool -genkeypair -v \
              -keystore "${ks_path}" \
              -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -alias edgeever-fork \
              -storepass edgeever-fork-pass \
              -keypass edgeever-fork-pass \
              -dname "CN=EdgeEver Fork, OU=Dev, O=abneil69, L=Local, S=Local, C=CN"
            store_pass="edgeever-fork-pass"
            key_alias="edgeever-fork"
            key_pass="edgeever-fork-pass"
          fi
          ./gradlew assembleRelease \
            --no-daemon \
            --parallel \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.injected.signing.store.file="${ks_path}" \
            -Pandroid.injected.signing.store.password="${store_pass}" \
            -Pandroid.injected.signing.key.alias="${key_alias}" \
            -Pandroid.injected.signing.key.password="${key_pass}" \
            -Pandroid.injected.signing.store.type=PKCS12
          rm -f "${ks_path}"

      - name: Stage APK
        run: |
          version="$(jq -r '.expo.version' apps/mobile/app.json)"
          short_sha="${GITHUB_SHA:0:8}"
          mkdir -p release/mobile
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "release/mobile/edgeever-android-v${version}-${short_sha}-arm64-v8a.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgeever-android-arm64-apk
          path: release/mobile/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release (on tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${TAG_NAME}" --generate-notes
          fi
          gh release upload "${TAG_NAME}" release/mobile/*.apk --repo "${GITHUB_REPOSITORY}" --clobber

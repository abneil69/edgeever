name: Fork Docker Image (linux/amd64)

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "docs/**"
      - "scripts/self-hosted-*.mjs"
      - "scripts/prepare-poster-thumbnails.*"
      - "scripts/precompress-self-hosted-assets.mjs"
      - "migrations/**"
      - "patches/**"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "bunfig.toml"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/fork-docker.yml"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      custom_tag:
        description: "Optional extra image tag (e.g. v2.32.0-custom.1)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.repository == 'abneil69/edgeever'
    name: Build and push linux/amd64 image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve image metadata and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA:0:12}"
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          version="$(jq -r '.version' package.json)"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            build_trigger="github_release"
            ref_tag="${RELEASE_TAG}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            build_trigger="main_push"
            ref_tag=""
          else
            build_trigger="manual"
            ref_tag="${CUSTOM_TAG:-}"
          fi
          {
            echo "image=${image}"
            echo "created_at=${created_at}"
            echo "build_trigger=${build_trigger}"
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${image}:latest"
            echo "${image}:main"
            echo "${image}:sha-${short_sha}"
            if [[ -n "${ref_tag}" ]]; then
              echo "${image}:${ref_tag}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
        env:
          CUSTOM_TAG: ${{ inputs.custom_tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            EDGE_EVER_BUILD_ID=${{ github.sha }}
            EDGE_EVER_BUILD_CREATED_AT=${{ steps.meta.outputs.created_at }}
            EDGE_EVER_BUILD_TRIGGER=${{ steps.meta.outputs.build_trigger }}
            EDGE_EVER_BUILD_METHOD=github_actions
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created_at }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
